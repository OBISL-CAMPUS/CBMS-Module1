    <style>

<body class="bg-slate-950 text-slate-50 font-sans h-screen overflow-hidden">
    <div id="root" class="h-full"></div>

    <script type="text/babel" data-presets="react,env">
        const { useState, useEffect, useRef } = React;

        const IconGlobe = () => <svg xmlns="http://www.w3.org/2000/svg" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round"><circle cx="12" cy="12" r="10"/><path d="M12 2a14.5 14.5 0 0 0 0 20 14.5 14.5 0 0 0 0-20"/><path d="M2 12h20"/></svg>;
        const IconBuilding = () => <svg xmlns="http://www.w3.org/2000/svg" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round"><rect width="16" height="20" x="4" y="2" rx="2" ry="2"/><path d="M9 22v-4h6v4"/><path d="M8 6h.01"/><path d="M16 6h.01"/><path d="M12 6h.01"/><path d="M12 10h.01"/><path d="M12 14h.01"/><path d="M16 10h.01"/><path d="M16 14h.01"/><path d="M8 10h.01"/><path d="M8 14h.01"/></svg>;
        const IconFlask = () => <svg xmlns="http://www.w3.org/2000/svg" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round"><path d="M10 2v7.31"/><path d="M14 9.3V1.99"/><path d="M8.5 2h7"/><path d="M14 9.3a6.5 6.5 0 1 1-4 0"/><path d="M5.52 16h12.96"/></svg>;
        const IconSettings = () => <svg xmlns="http://www.w3.org/2000/svg" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round"><path d="M12.22 2h-.44a2 2 0 0 0-2 2v.18a2 2 0 0 1-1 1.73l-.43.25a2 2 0 0 1-2 0l-.15-.08a2 2 0 0 0-2.73.73l-.22.38a2 2 0 0 0 .73 2.73l.15.1a2 2 0 0 1 1 1.72v.51a2 2 0 0 1-1 1.74l-.15.09a2 2 0 0 0-.73 2.73l.22.38a2 2 0 0 0 2.73.73l.15-.08a2 2 0 0 1 2 0l.43.25a2 2 0 0 1 1 1.73V20a2 2 0 0 0 2 2h.44a2 2 0 0 0 2-2v-.18a2 2 0 0 1 1-1.73l.43-.25a2 2 0 0 1 2 0l.15.08a2 2 0 0 0 2.73-.73l.22-.39a2 2 0 0 0-.73-2.73l-.15-.08a2 2 0 0 1-1-1.74v-.5a2 2 0 0 1 1-1.74l.15-.09a2 2 0 0 0 .73-2.73l-.22-.38a2 2 0 0 0-2.73-.73l-.15.08a2 2 0 0 1-2 0l-.43-.25a2 2 0 0 1-1-1.73V4a2 2 0 0 0-2-2z"/><circle cx="12" cy="12" r="3"/></svg>;
        const IconTerminal = () => <svg xmlns="http://www.w3.org/2000/svg" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round"><polyline points="4 17 10 11 4 5"/><line x1="12" x2="20" y1="19" y2="19"/></svg>;
        const IconMessage = () => <svg xmlns="http://www.w3.org/2000/svg" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round"><path d="M21 15a2 2 0 0 1-2 2H7l-4 4V5a2 2 0 0 1 2-2h14a2 2 0 0 1 2 2z"/></svg>;
        const IconPrinter = () => <svg xmlns="http://www.w3.org/2000/svg" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round"><polyline points="6 9 6 2 18 2 18 9"/><path d="M6 18H4a2 2 0 0 1-2-2v-5a2 2 0 0 1 2-2h16a2 2 0 0 1 2 2v5a2 2 0 0 1-2 2h-2"/><rect width="12" height="8" x="6" y="14"/></svg>;
        const IconTarget = () => <svg xmlns="http://www.w3.org/2000/svg" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round"><circle cx="12" cy="12" r="10"/><circle cx="12" cy="12" r="6"/><circle cx="12" cy="12" r="2"/></svg>;
        const IconWorkflow = () => <svg xmlns="http://www.w3.org/2000/svg" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round"><rect width="18" height="18" x="3" y="3" rx="2"/><path d="M8 7v8"/><path d="M12 7v4"/><path d="M16 7v10"/></svg>;

        const TabCaseInsight = () => (
            <div className="space-y-6 animate-fade-in">
                <div className="mb-8">
                    <h2 className="text-2xl font-bold text-brand-500 mb-2">Zenith Corp: The Hybrid Reality</h2>
                    <p className="text-slate-400">Module 1 Core Case Study Breakdown</p>
                    <p className="text-sm text-slate-500 italic mt-1 font-sinhala">මොඩියුලය 1: ප්‍රධාන සිද්ධි අධ්‍යයනය</p>
                </div>
                <div className="grid grid-cols-1 md:grid-cols-3 gap-6">
                    <div className="glass-panel p-6 rounded-2xl border-t-4 border-t-red-500">
                        <div className="text-red-400 mb-4 font-bold tracking-widest text-sm">01 / PROBLEM</div>
                        <h3 className="text-xl font-semibold mb-3">Rigid Rule Books</h3>
                        <p className="text-slate-300 text-sm mb-4 leading-relaxed">The transition caused acute pain for long-term administrators who struggled without rigid rule books, exposing the tension between legacy stability and modern agility.</p>
                        <div className="pt-4 border-t border-slate-700/50">
                            <h4 className="text-sm font-semibold text-slate-400 mb-2 font-sinhala">ගැටලුව</h4>
                            <p className="text-slate-500 text-sm italic font-sinhala">දැඩි නීති රීති නොමැතිව කටයුතු කිරීමට දිගුකාලීන පරිපාලකයින් අපහසුතාවයට පත්වීම නිසා පැරණි ස්ථාවරත්වය සහ නවීන වේගවත් බව අතර ගැටුමක් ඇති විය.</p>
                        </div>
                    </div>
                    <div className="glass-panel p-6 rounded-2xl border-t-4 border-t-blue-500">
                        <div className="text-blue-400 mb-4 font-bold tracking-widest text-sm">02 / APPROACH</div>
                        <h3 className="text-xl font-semibold mb-3">Hybrid Planning Model</h3>
                        <p className="text-slate-300 text-sm mb-4 leading-relaxed">Implementing an Automated Administrative Core for annual corporate vision/compliance, merged with a Flat, Agile Management structure for real-time pivots.</p>
                        <div className="pt-4 border-t border-slate-700/50">
                            <h4 className="text-sm font-semibold text-slate-400 mb-2 font-sinhala">ප්‍රවේශය</h4>
                            <p className="text-slate-500 text-sm italic font-sinhala">වාර්ෂික දැක්ම සහ අනුකූලතාවය සඳහා ස්වයංක්‍රීය පරිපාලන හරයක් සමඟ, ක්ෂණික තීරණ සඳහා පැතලි, වේගවත් කළමනාකරණ ව්‍යුහයක් ඒකාබද්ධ කිරීම.</p>
                        </div>
                    </div>
                    <div className="glass-panel p-6 rounded-2xl border-t-4 border-t-brand-500">
                        <div className="text-brand-400 mb-4 font-bold tracking-widest text-sm">03 / RESULT</div>
                        <h3 className="text-xl font-semibold mb-3">Agile Breakthrough</h3>
                        <p className="text-slate-300 text-sm mb-4 leading-relaxed">A highly optimized corporate machine resulting in <span className="text-brand-400 font-bold">-3 Management Layers</span> and <span className="text-brand-400 font-bold">+40% Employee Engagement</span>.</p>
                        <div className="pt-4 border-t border-slate-700/50">
                            <h4 className="text-sm font-semibold text-slate-400 mb-2 font-sinhala">ප්‍රතිඵලය</h4>
                            <p className="text-slate-500 text-sm italic font-sinhala">කළමනාකරණ ස්ථර 3කින් අඩු කිරීම සහ සේවක සහභාගීත්වය 40%කින් වැඩි කරමින් ඉහළ ප්‍රශස්තකරණයකට ලක්වූ ආයතනික ව්‍යුහයක් නිර්මාණය වීම.</p>
                        </div>
                    </div>
                </div>
            </div>
        );

        const TabDeepDive = () => {
            const concepts = [
                { title: "Management vs. Administration", titleSin: "කළමනාකරණය සහ පරිපාලනය", en: "Management is strategic, fluid, and action-oriented (focusing on 'How' and 'Who'). Administration is policy-driven, procedural, and establishing boundaries (focusing on 'What' and 'When').", sin: "කළමනාකරණය යනු උපායමාර්ගික, වෙනස්වන සුළු සහ ක්‍රියාකාරී අංශයකි ('කෙසේද' යන්න). පරිපාලනය යනු ප්‍රතිපත්ති මත පදනම් වූ සහ සීමාවන් ස්ථාපිත කරන ක්‍රියා පටිපාටියකි ('කුමක්ද' යන්න)." },
                { title: "Tall vs. Flat Organizational Structures", titleSin: "උසස් (Tall) සහ පැතලි (Flat) සංවිධාන ව්‍යුහයන්", en: "Tall structures provide rigid hierarchy and stability but suffer from slow communication. Flat structures empower employees and enable rapid pivots, matching the modern Agile framework.", sin: "උසස් ව්‍යුහයන් දැඩි ධූරාවලියක් සහ ස්ථාවරත්වයක් ලබා දුන්නද සන්නිවේදනය ප්‍රමාද කරයි. පැතලි ව්‍යුහයන් සේවකයින් සවිබල ගන්වන අතර වේගවත් තීරණ ගැනීමට ඉඩ සසලසයි." },
                { title: "Scientific vs. Humanistic Management", titleSin: "විද්‍යාත්මක සහ මානවවාදී කළමනාකරණය", en: "Taylor's Scientific approach focuses on standardizing tasks for maximum efficiency ('One Best Way'). The Humanistic approach shifts focus to employee well-being, psychology, and engagement.", sin: "ටේලර්ගේ විද්‍යාත්මක ක්‍රමය උපරිම කාර්යක්ෂමතාව සඳහා කාර්යයන් ප්‍රමිතිකරණය කරයි. මානවවාදී ක්‍රමය සේවක යහපැවැත්ම සහ මානසිකත්වය කෙරෙහි අවධානය යොමු කරයි." }
            ];
            return (
                <div className="space-y-6 animate-fade-in">
                    <div className="mb-8">
                        <h2 className="text-2xl font-bold text-brand-500 mb-2">Theoretical Core Deep Dive</h2>
                        <p className="text-slate-400">Interactive Analysis of Fundamental Traits</p>
                        <p className="text-sm text-slate-500 italic mt-1 font-sinhala">මූලික සංකල්ප පිළිබඳ ගැඹුරු විශ්ලේෂණය</p>
                    </div>
                    <div className="grid grid-cols-1 gap-4">
                        {concepts.map((item, i) => (
                            <div key={i} className="glass-panel p-5 rounded-xl transition-all hover:bg-slate-800/60 group">
                                <div className="flex flex-col md:flex-row gap-6 items-start">
                                    <div className="bg-slate-800 text-brand-400 w-12 h-12 rounded-lg flex items-center justify-center font-bold text-xl shrink-0">0{i+1}</div>
                                    <div className="flex-1">
                                        <h3 className="text-lg font-bold text-slate-100 mb-1">{item.title}</h3>
                                        <p className="text-brand-500/80 font-sinhala text-sm mb-3">{item.titleSin}</p>
                                        <div className="bg-slate-900/50 p-4 rounded-lg border border-slate-700/50 mb-3">
                                            <p className="text-slate-300 text-sm leading-relaxed">{item.en}</p>
                                        </div>
                                        <div className="px-4">
                                            <p className="text-slate-500 text-sm italic font-sinhala leading-relaxed">{item.sin}</p>
                                        </div>
                                    </div>
                                </div>
                            </div>
                        ))}
                    </div>
                </div>
            );
        };

        const TabScenarioSuite = () => {
            const scenarios = [
                { id: "A", type: "The App Start-Up", typeSin: "නව තාක්ෂණික සමාගම (Startup)", context: "High market volatility, rapid product iterations required.", en: "Requires a Flat Agile structure. Strict scientific administration will kill innovation. Focus on tiger teams and real-time metrics.", sin: "පැතලි සහ වේගවත් ව්‍යුහයක් අවශ්‍ය වේ. දැඩි විද්‍යාත්මක පරිපාලනය නවෝත්පාදනය විනාශ කරයි. කණ්ඩායම් වැඩ සහ ක්ෂණික තීරණ කෙරෙහි අවධානය යොමු කරන්න." },
                { id: "B", type: "The Garment Factory", typeSin: "ඇඟලුම් කර්මාන්තශාලාව", context: "High volume production, narrow margins, large workforce.", en: "Relies heavily on Scientific Management. Needs clear hierarchies (Tall Structure), 'One Best Way' standardization, and strict administrative rule books to maintain output.", sin: "විද්‍යාත්මක කළමනාකරණය මත දැඩි ලෙස රඳා පවතී. නිෂ්පාදනය පවත්වා ගැනීම සඳහා පැහැදිලි ධූරාවලියක් (උසස් ව්‍යුහයක්), ප්‍රමිතිකරණය සහ දැඩි පරිපාලන නීති අවශ්‍ය වේ." },

            return (
                <div className="space-y-6 h-full flex flex-col">
                    <div className="mb-2 shrink-0">
                        <h2 className="text-2xl font-bold text-brand-500 mb-2">Workflow Management Simulator</h2>
                        <p className="text-slate-400">Comparing Taylor's Scientific Management vs. Modern Agile Workflows.</p>
                    </div>
                    <div className="flex-1 glass-panel rounded-xl border border-slate-700/50 p-6 flex flex-col">
                        <div className="flex justify-center mb-8 shrink-0">
                            <div className="bg-slate-900 p-1 rounded-xl flex border border-slate-700">
                                <button onClick={() => setModel('scientific')} className={`px-6 py-2 rounded-lg font-semibold ${model === 'scientific' ? 'bg-blue-600 text-white' : 'text-slate-400'}`}>Scientific</button>
                                <button onClick={() => setModel('agile')} className={`px-6 py-2 rounded-lg font-semibold ${model === 'agile' ? 'bg-brand-500 text-white' : 'text-slate-400'}`}>Agile</button>
                            </div>
                        </div>
                        <div className="flex-1 bg-slate-950/50 rounded-xl p-8 flex items-center justify-center relative overflow-hidden">
                            {model === 'scientific' ? (
                                <div className="flex items-center gap-4 w-full max-w-3xl overflow-x-auto">
                                    <div className="bg-slate-800 border-2 border-blue-500/50 p-4 rounded text-center min-w-[150px]"><div className="font-bold">Standardize</div></div>
                                    <div className="text-blue-500 font-black">→</div>
                                    <div className="bg-slate-800 border-2 border-blue-500/50 p-4 rounded text-center min-w-[150px]"><div className="font-bold">Execute</div></div>
                                    <div className="text-blue-500 font-black">→</div>
                                    <div className="bg-slate-800 border-2 border-blue-500/50 p-4 rounded text-center min-w-[150px]"><div className="font-bold">Inspect</div></div>
                                </div>
                            ) : (
                                <div className="relative w-64 h-64">
                                    <div className="absolute inset-0 border-4 border-dashed border-brand-500/30 rounded-full animate-spin"></div>
                                    <div className="absolute top-0 left-1/2 -translate-x-1/2 -translate-y-1/2 bg-slate-800 border-2 border-brand-500 p-3 rounded-lg"><div className="font-bold">Plan</div></div>
                                    <div className="absolute bottom-0 left-1/2 -translate-x-1/2 translate-y-1/2 bg-slate-800 border-2 border-brand-500 p-3 rounded-lg"><div className="font-bold">Review</div></div>
                                    <div className="absolute top-1/2 left-0 -translate-x-1/2 -translate-y-1/2 bg-slate-800 border-2 border-brand-500 p-3 rounded-lg"><div className="font-bold">Build</div></div>
                                    <div className="absolute top-1/2 right-0 translate-x-1/2 -translate-y-1/2 bg-slate-800 border-2 border-brand-500 p-3 rounded-lg"><div className="font-bold">Adapt</div></div>
                                </div>
                            )}
                        </div>
                    </div>
                </div>
            );
        };

        const TabBreakoutRooms = () => {
            const prompts = [
                { q: "Crisis Mechanics: In a critical disruption, does a Tall Structure or a Flat Structure offer superior resilience?", qSin: "අර්බුදයකදී උසස් හෝ පැතලි ව්‍යුහයකින් වඩාත් ඔරොත්තු දෙන්නේ කුමක්ද?" },
                { q: "The Dual Engine: Why is a brilliant Manager guaranteed to fail if they operate as a poor Administrator?", qSin: "දක්ෂ කළමනාකරුවෙකු දුර්වල පරිපාලකයෙකු ලෙස කටයුතු කළහොත් අසමත් වන්නේ ඇයි?" },
                { q: "The Balance: How do you calibrate the demand for Scientific efficiency against the Humanistic necessity of employee well-being?", qSin: "විද්‍යාත්මක කාර්යක්ෂමතාව සහ මානවවාදී සේවක යහපැවැත්ම සමබර කරන්නේ කෙසේද?" }
            ];
            return (
                <div className="space-y-6">
                    {prompts.map((p, i) => (
                        <div key={i} className="glass-panel p-5 rounded-xl border-l-4 border-l-brand-500">
                            <p className="text-lg font-semibold text-slate-100 mb-2">{p.q}</p>
                            <p className="text-sm text-slate-400 italic font-sinhala">{p.qSin}</p>
                        </div>
                    ))}
                </div>
            );
        };

        const App = () => {
            const [activeTab, setActiveTab] = useState('case');
            const navItems = [
                { id: 'case', icon: <IconGlobe />, label: 'Case Insight' },
                { id: 'deepdive', icon: <IconBuilding />, label: 'Deep Dive' },
                { id: 'scenario', icon: <IconFlask />, label: 'Scenario Suite' },
                { id: 'diagnostic', icon: <IconSettings />, label: 'Diagnostic Lab' },
                { id: 'system-hris', icon: <IconTerminal />, label: 'HRIS Demo' },
                { id: 'system-kpi', icon: <IconTarget />, label: 'KPI Cascade' },
                { id: 'system-workflow', icon: <IconWorkflow />, label: 'Workflow Sim' },
            ];
            return (
                <div className="flex h-screen bg-slate-950 overflow-hidden relative">
                    <nav className="w-20 md:w-24 bg-slate-900/80 backdrop-blur-xl border-r border-slate-800 flex flex-col items-center py-6 z-20 shrink-0">
                        <div className="w-10 h-10 bg-gradient-to-br from-brand-400 to-brand-600 rounded-lg flex items-center justify-center font-black text-white mb-6">OB</div>
                        <div className="flex-1 flex flex-col gap-4 w-full px-2 overflow-y-auto no-scrollbar">
                            {navItems.map(item => (
                                <button key={item.id} onClick={() => setActiveTab(item.id)} className={`w-12 h-12 mx-auto rounded-xl flex items-center justify-center transition-all ${activeTab === item.id ? 'bg-brand-500/10 text-brand-400 border border-brand-500/30' : 'text-slate-500'}`}>{item.icon}</button>
                            ))}
                        </div>
                    </nav>
                    <main className="flex-1 flex flex-col h-full overflow-y-auto z-10">
                        <header className="px-8 py-6 border-b border-slate-800/50 bg-slate-950/50 backdrop-blur-md sticky top-0 z-30">
                            <div className="max-w-5xl mx-auto flex justify-between items-end">
                                <div>
                                    <h1 className="text-lg md:text-xl font-black tracking-widest text-slate-100"><span className="text-brand-500">OBISL CAMPUS</span> | BILINGUAL PRACTICUM</h1>
                                    <p className="text-xs text-slate-400 font-mono mt-1">Module 1: Business & Management Principles</p>
                                </div>
                            </div>
                        </header>
                        <div className="flex-1 p-6 md:p-10">
                            <div className="max-w-5xl mx-auto h-full">
                                {activeTab === 'case' && <TabCaseInsight />}
                                {activeTab === 'deepdive' && <TabDeepDive />}
                                {activeTab === 'scenario' && <TabScenarioSuite />}
                                {activeTab === 'diagnostic' && <TabDiagnosticLab />}
                                {activeTab === 'system-hris' && <TabSystemSimulation />}
                                {activeTab === 'system-kpi' && <TabSystemKPI />}
                                {activeTab === 'system-workflow' && <TabSystemWorkflow />}
                            </div>
                        </div>
                    </main>
                </div>
            );
        };

        const root = ReactDOM.createRoot(document.getElementById('root'));
        root.render(<App />);
    </script>
</body>
</html>
