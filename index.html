                        <div className="md:col-span-8 glass-panel print-glass p-6 rounded-xl border border-slate-700/50 flex flex-col items-center justify-center relative overflow-hidden">
                            <div className="absolute top-10 bottom-10 w-1 bg-gradient-to-b from-blue-500 via-purple-500 to-brand-500 z-0"></div>
                            
                            <div className="relative z-10 bg-slate-900 border-2 border-blue-500 p-5 rounded-xl w-3/4 mb-8 text-center shadow-lg shadow-blue-900/20 transition-all duration-500">
                                <div className="text-xs font-bold text-blue-400 uppercase tracking-widest mb-2">1. Administration (The "What")</div>
                                <h4 className="text-lg font-semibold text-white">{current.admin}</h4>
                                <div className="text-xs text-slate-500 font-sinhala italic mt-1">පරිපාලන මට්ටම - ප්‍රධාන ප්‍රතිපත්ති</div>
                            </div>

                            <div className="relative z-10 bg-slate-900 border-2 border-purple-500 p-5 rounded-xl w-3/4 mb-8 text-center shadow-lg shadow-purple-900/20 transition-all duration-500">
                                <div className="text-xs font-bold text-purple-400 uppercase tracking-widest mb-2">2. Management (The "How")</div>
                                <h4 className="text-lg font-semibold text-white">{current.mgmt}</h4>
                                <div className="text-xs text-slate-500 font-sinhala italic mt-1">කළමනාකරණ මට්ටම - දෙපාර්තමේන්තු ඉලක්ක</div>
                            </div>

                            <div className="relative z-10 bg-slate-900 border-2 border-brand-500 p-5 rounded-xl w-3/4 text-center shadow-lg shadow-brand-900/20 transition-all duration-500">
                                <div className="text-xs font-bold text-brand-400 uppercase tracking-widest mb-2">3. Agile Operations (The "Action")</div>
                                <h4 className="text-lg font-semibold text-white">{current.agile}</h4>
                                <div className="text-xs text-slate-500 font-sinhala italic mt-1">මෙහෙයුම් මට්ටම - කඩිනම් කාර්යයන්</div>
                            </div>
                        </div>
                    </div>
                </div>
            );
        };

        const TabSystemWorkflow = () => {
            const [model, setModel] = useState('scientific');

            return (
                <div className="space-y-6 animate-fade-in h-full flex flex-col">
                    <div className="mb-2 shrink-0">
                        <h2 className="text-2xl font-bold text-brand-500 mb-2 print-text">Workflow Management Simulator</h2>
                        <p className="text-slate-400 print-text-muted">Comparing Taylor's Scientific Management vs. Modern Agile Workflows.</p>
                        <p className="text-sm text-slate-500 italic mt-1 font-sinhala">විද්‍යාත්මක කළමනාකරණය සහ නවීන වේගවත් (Agile) ක්‍රමවේද සැසඳීම.</p>
                    </div>

                    <div className="flex-1 glass-panel print-glass rounded-xl border border-slate-700/50 p-6 flex flex-col">
                        
                        <div className="flex justify-center mb-8 shrink-0">
                            <div className="bg-slate-900 p-1 rounded-xl flex border border-slate-700">
                                <button onClick={() => setModel('scientific')} className={`px-6 py-2 rounded-lg font-semibold transition-all ${model === 'scientific' ? 'bg-blue-600 text-white' : 'text-slate-400 hover:text-slate-200'}`}>
                                    Scientific (Linear)
                                </button>
                                <button onClick={() => setModel('agile')} className={`px-6 py-2 rounded-lg font-semibold transition-all ${model === 'agile' ? 'bg-brand-500 text-white' : 'text-slate-400 hover:text-slate-200'}`}>
                                    Agile (Iterative)
                                </button>
                            </div>
                        </div>

                        <div className="flex-1 bg-slate-950/50 rounded-xl border border-slate-800 p-8 flex items-center justify-center relative overflow-hidden">
                            {model === 'scientific' ? (
                                <div className="flex items-center gap-4 animate-fade-in w-full max-w-3xl overflow-x-auto">
                                    <div className="bg-slate-800 border-2 border-blue-500/50 p-4 rounded text-center min-w-[150px]">
                                        <div className="text-xs text-blue-400 mb-1 font-mono">Stage 1</div>
                                        <div className="font-bold">Standardize</div>
                                    </div>
                                    <div className="text-blue-500 font-black text-2xl">→</div>
                                    <div className="bg-slate-800 border-2 border-blue-500/50 p-4 rounded text-center min-w-[150px]">
                                        <div className="text-xs text-blue-400 mb-1 font-mono">Stage 2</div>
                                        <div className="font-bold">Execute</div>
                                    </div>
                                    <div className="text-blue-500 font-black text-2xl">→</div>
                                    <div className="bg-slate-800 border-2 border-blue-500/50 p-4 rounded text-center min-w-[150px]">
                                        <div className="text-xs text-blue-400 mb-1 font-mono">Stage 3</div>
                                        <div className="font-bold">Inspect</div>
                                    </div>
                                    
                                    <div className="absolute bottom-4 left-0 right-0 text-center text-sm text-slate-400 font-sinhala italic animate-fade-in">
                                        "One Best Way" - දැඩි, පියවරෙන් පියවර සිදුවන රේඛීය ක්‍රමවේදය (Taylor's Theory)
                                    </div>
                                </div>
                            ) : (
                                <div className="relative w-64 h-64 animate-fade-in">
                                    <div className="absolute inset-0 border-4 border-dashed border-brand-500/30 rounded-full animate-[spin_10s_linear_infinite]"></div>
                                    
                                    <div className="absolute top-0 left-1/2 -translate-x-1/2 -translate-y-1/2 bg-slate-800 border-2 border-brand-500 p-3 rounded-lg text-center shadow-lg shadow-brand-900/20">
                                        <div className="text-xs text-brand-400 mb-1 font-mono">Sprint</div>
                                        <div className="font-bold">Plan</div>
                                    </div>
                                    <div className="absolute bottom-0 left-1/2 -translate-x-1/2 translate-y-1/2 bg-slate-800 border-2 border-brand-500 p-3 rounded-lg text-center shadow-lg shadow-brand-900/20">
                                        <div className="text-xs text-brand-400 mb-1 font-mono">Sprint</div>
                                        <div className="font-bold">Review</div>
                                    </div>
                                    <div className="absolute top-1/2 left-0 -translate-x-1/2 -translate-y-1/2 bg-slate-800 border-2 border-brand-500 p-3 rounded-lg text-center shadow-lg shadow-brand-900/20">
                                        <div className="text-xs text-brand-400 mb-1 font-mono">Daily</div>
                                        <div className="font-bold">Build</div>
                                    </div>
                                    <div className="absolute top-1/2 right-0 translate-x-1/2 -translate-y-1/2 bg-slate-800 border-2 border-brand-500 p-3 rounded-lg text-center shadow-lg shadow-brand-900/20">
                                        <div className="text-xs text-brand-400 mb-1 font-mono">Live</div>
                                        <div className="font-bold">Adapt</div>
                                    </div>

                                    <div className="absolute inset-0 flex items-center justify-center">
                                        <div className="text-center">
                                            <div className="font-black text-brand-400">TIGER</div>
                                            <div className="font-black text-brand-400">TEAM</div>
                                        </div>
                                    </div>

                                    <div className="absolute -bottom-16 left-1/2 -translate-x-1/2 w-80 text-center text-sm text-slate-400 font-sinhala italic whitespace-nowrap">
                                        ස්වයං පාලිත කණ්ඩායම් සහ චක්‍රීය, නම්‍යශීලී ක්‍රමවේදය (Modern Humanistic)
                                    </div>
                                </div>
                            )}
                        </div>
                    </div>
                </div>
            );
        };

        const TabBreakoutRooms = () => {
            const prompts = [
                {
                    q: "Crisis Mechanics: In a critical disruption, does a Tall Structure or a Flat Structure offer superior resilience?",
                    qSin: "අර්බුදයකදී උසස් හෝ පැතලි ව්‍යුහයකින් වඩාත් ඔරොත්තු දෙන්නේ කුමක්ද?"
                },
                {
                    q: "The Dual Engine: Why is a brilliant Manager guaranteed to fail if they operate as a poor Administrator?",
                    qSin: "දක්ෂ කළමනාකරුවෙකු දුර්වල පරිපාලකයෙකු ලෙස කටයුතු කළහොත් අසමත් වන්නේ ඇයි?"
                },
                {
                    q: "The Balance: How do you calibrate the demand for Scientific efficiency against the Humanistic necessity of employee well-being?",
                    qSin: "විද්‍යාත්මක කාර්යක්ෂමතාව සහ මානවවාදී සේවක යහපැවැත්ම සමබර කරන්නේ කෙසේද?"
                },
                {
                    q: "The Objective Cascade: Can departmental operations survive without individual KPIs if corporate objectives are clear?",
                    qSin: "පැහැදිලි ආයතනික අරමුණු තිබේ නම්, තනි පුද්ගල KPI නොමැතිව වුවද ක්‍රියාකාරකම් පවත්වා ගත හැකිද?"
                },
                {
                    q: "The AI Future: With AI integration, how will the mathematical function of Organizing transform for middle managers?",
                    qSin: "කෘතිම බුද්ධිය (AI) පැමිණීමත් සමඟ මධ්‍යම කළමනාකරුවන්ගේ සංවිධාන කටයුතු කෙසේ වෙනස් වනු ඇත්ද?"
                }
            ];

            return (
                <div className="space-y-6 animate-fade-in">
                    <div className="mb-8">
                        <h2 className="text-2xl font-bold text-brand-500 mb-2 print-text">Breakout Room Prompts</h2>
                        <p className="text-slate-400 print-text-muted">High-Impact Discussion Generators</p>
                        <p className="text-sm text-slate-500 italic mt-1 font-sinhala">සාකච්ඡා සඳහා වන ප්‍රධාන ප්‍රශ්න</p>
                    </div>

                    <div className="space-y-4">
                        {prompts.map((p, i) => (
                            <div key={i} className="glass-panel print-glass p-5 rounded-xl border-l-4 border-l-brand-500 hover:bg-slate-800/50 transition-colors">
                                <div className="flex gap-4">
                                    <div className="hidden md:flex w-10 h-10 rounded-full bg-brand-900/50 border border-brand-500/30 items-center justify-center shrink-0">
                                        <IconMessage />
                                    </div>
                                    <div>
                                        <p className="text-lg font-semibold text-slate-100 print-text mb-2 leading-snug">{p.q}</p>
                                        <p className="text-sm text-slate-400 print-text-muted italic font-sinhala">{p.qSin}</p>
                                    </div>
                                </div>
                            </div>
                        ))}
                    </div>
                </div>
            );
        };

        // --- MAIN APP ---
        const App = () => {
            const [activeTab, setActiveTab] = useState('case');

            const handlePrint = () => {
                window.print();
            };

            const navItems = [
                { id: 'case', icon: <IconGlobe />, label: 'Case Insight' },
                { id: 'deepdive', icon: <IconBuilding />, label: 'Deep Dive' },
                { id: 'scenario', icon: <IconFlask />, label: 'Scenario Suite' },
                { id: 'diagnostic', icon: <IconSettings />, label: 'Diagnostic Lab' },
                { id: 'system-hris', icon: <IconTerminal />, label: 'HRIS Demo' },
                { id: 'system-kpi', icon: <IconTarget />, label: 'KPI Cascade' },
                { id: 'system-workflow', icon: <IconWorkflow />, label: 'Workflow Sim' },
                { id: 'breakout', icon: <IconMessage />, label: 'Breakout' },
            ];

            return (
                <div className="flex h-screen bg-slate-950 overflow-hidden relative">
                    
                    <div className="absolute top-0 left-0 w-full h-full overflow-hidden pointer-events-none z-0 print-hide">
                        <div className="absolute top-[-10%] left-[-10%] w-[40%] h-[40%] bg-brand-900/20 rounded-full blur-[100px]"></div>
                        <div className="absolute bottom-[-10%] right-[-10%] w-[30%] h-[30%] bg-tech-900/20 rounded-full blur-[100px]"></div>
                    </div>

                    <nav className="w-20 md:w-24 bg-slate-900/80 backdrop-blur-xl border-r border-slate-800 flex flex-col items-center py-6 z-20 shrink-0 print-hide">
                        <div className="w-10 h-10 shrink-0 bg-gradient-to-br from-brand-400 to-brand-600 rounded-lg flex items-center justify-center font-black text-white mb-6 shadow-lg shadow-brand-500/20">
                            OB
                        </div>
                        
                        <div className="flex-1 flex flex-col gap-4 w-full px-2 overflow-y-auto no-scrollbar pb-4">
                            {navItems.map(item => (
                                <button 
                                    key={item.id}
                                    onClick={() => setActiveTab(item.id)}
                                    className={`relative group w-12 h-12 shrink-0 mx-auto rounded-xl flex items-center justify-center transition-all duration-300
                                        ${activeTab === item.id 
                                            ? 'bg-brand-500/10 text-brand-400 border border-brand-500/30' 
                                            : 'text-slate-500 hover:text-slate-300 hover:bg-slate-800/50'}`}
                                >
                                    {item.icon}
                                    
                                    <div className="absolute left-full ml-4 px-3 py-1.5 bg-slate-800 text-slate-200 text-xs font-semibold rounded opacity-0 invisible group-hover:opacity-100 group-hover:visible transition-all whitespace-nowrap z-50 border border-slate-700">
                                        {item.label}
                                    </div>
                                </button>
                            ))}
                        </div>

                        <button onClick={handlePrint} className="w-12 h-12 shrink-0 rounded-xl text-slate-500 hover:text-white hover:bg-slate-800 transition-colors flex items-center justify-center mt-4 tooltip group relative">
                            <IconPrinter />
                            <div className="absolute left-full ml-4 px-3 py-1.5 bg-slate-800 text-slate-200 text-xs font-semibold rounded opacity-0 invisible group-hover:opacity-100 group-hover:visible transition-all whitespace-nowrap z-50 border border-slate-700">
                                Export / Print
                            </div>
                        </button>
                    </nav>

                    <main className="flex-1 flex flex-col h-full overflow-y-auto z-10 relative print:w-full print:overflow-visible">
                        
                        <header className="px-8 py-6 border-b border-slate-800/50 bg-slate-950/50 backdrop-blur-md sticky top-0 z-30 print-glass print:border-b-2">
                            <div className="max-w-5xl mx-auto flex justify-between items-end">
                                <div>
                                    <h1 className="text-lg md:text-xl font-black tracking-widest text-slate-100 print-text flex items-center gap-3">
                                        <span className="text-brand-500">OBISL CAMPUS</span> | BILINGUAL PRACTICUM
                                    </h1>
                                    <p className="text-xs text-slate-400 font-mono mt-1 print-text-muted">Module 1: Business & Management Principles</p>
                                </div>
                                <div className="hidden md:block text-right">
                                    <div className="text-[10px] uppercase tracking-[0.2em] text-brand-500 font-bold">System Status</div>
                                    <div className="text-xs text-slate-400 font-mono">Live • English/සිංහල</div>
                                </div>
                            </div>
                        </header>

                        <div className="flex-1 p-6 md:p-10">
                            <div className="max-w-5xl mx-auto h-full">
                                {activeTab === 'case' && <TabCaseInsight />}
                                {activeTab === 'deepdive' && <TabDeepDive />}
                                {activeTab === 'scenario' && <TabScenarioSuite />}
                                {activeTab === 'diagnostic' && <TabDiagnosticLab />}
                                {activeTab === 'system-hris' && <TabSystemSimulation />}
                                {activeTab === 'system-kpi' && <TabSystemKPI />}
                                {activeTab === 'system-workflow' && <TabSystemWorkflow />}
                                {activeTab === 'breakout' && <TabBreakoutRooms />}
                            </div>
                        </div>
                    </main>

                </div>
            );
        };

        const root = ReactDOM.createRoot(document.getElementById('root'));
        root.render(<App />);
        `;

        // Compiles JSX cleanly on deployment architecture
        const output = Babel.transform(code, { presets: ["react", "env"] }).code;
        const scriptEl = document.createElement("script");
        scriptEl.text = output;
        document.body.appendChild(scriptEl);
    </script>
</body>
</html>
